		<!-- Baú Fechado (Área Restrita / Deslogado) -->
		<symbol id="icon-chest-closed" viewBox="0 0 32 32">
			<!-- Tampa superior curvada -->
			<path d="M5 12c0-3 3-4 11-4s11 1 11 4v2H5v-2z" fill="#92400e" stroke="#451a03" stroke-width="1.5"/>
			<rect x="5" y="14" width="22" height="13" rx="1" fill="#78350f" stroke="#451a03" stroke-width="1.5"/>
			<!-- Cintas de metal laterais -->
			<rect x="5" y="12" width="3" height="15" fill="#64748b"/>
			<rect x="24" y="12" width="3" height="15" fill="#64748b"/>
			<!-- Linhas horizontais de reforço -->
			<path d="M5 18h22" stroke="#451a03" stroke-width="1"/>
			<!-- Fechadura dourada -->
			<rect x="14" y="16" width="4" height="5" fill="#f59e0b" stroke="#78350f" stroke-width="1"/>
			<circle cx="16" cy="18.5" r="1" fill="#451a03"/>
		</symbol>

		<!-- Baú Aberto com Tesouro (Mestre Logado) - Versão Aprimorada -->
		<symbol id="icon-chest-open" viewBox="0 0 32 32">
			<!-- Tampa aberta inclinada para trás -->
			<path d="M5 15L2 3h28l-3 12z" fill="#b45309" stroke="#451a03" stroke-width="1.5"/>
			<path d="M6 5h20" stroke="#d97706" stroke-width="1"/>
			<rect x="7" y="7" width="18" height="6" fill="#92400e" rx="1"/>
			<!-- Cintas metálicas da tampa -->
			<path d="M7 15L4 3" stroke="#64748b" stroke-width="2"/>
			<path d="M25 15l3-12" stroke="#64748b" stroke-width="2"/>

			<!-- Tesouro e Brilho Interno (Ouro e Joias) -->
			<rect x="7" y="13" width="18" height="5" fill="#f59e0b"/>
			<rect x="9" y="11" width="14" height="3" fill="#fef08a"/>
			<!-- Joias coloridas no tesouro -->
			<rect x="11" y="12" width="2" height="2" fill="#ef4444"/>
			<rect x="15" y="11" width="2" height="2" fill="#38bdf8"/>
			<rect x="19" y="12" width="2" height="2" fill="#22c55e"/>
			<circle cx="16" cy="14" r="1.5" fill="#ffffff"/>

			<!-- Base do Baú -->
			<rect x="5" y="15" width="22" height="13" rx="1" fill="#78350f" stroke="#451a03" stroke-width="1.5"/>
			<!-- Cintas de metal laterais da base -->
			<rect x="5" y="15" width="3" height="13" fill="#64748b"/>
			<rect x="24" y="15" width="3" height="13" fill="#64748b"/>
			<!-- Linha de reforço horizontal -->
			<path d="M5 21h22" stroke="#451a03" stroke-width="1.5"/>
			<!-- Fechadura aberta na base -->
			<rect x="14" y="22" width="4" height="4" fill="#f59e0b" stroke="#78350f" stroke-width="1"/>
		</symbol>


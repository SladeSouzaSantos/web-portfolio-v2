		<!-- 1. Esfera Vermelha LinkedIn (Perfeitamente Centralizada) -->
<symbol id="icon-orb-linkedin" viewBox="0 0 64 64">
  <!-- Sombra / Borda externa da esfera -->
  <circle cx="32" cy="34" r="24" fill="#1e0404"/>
  <!-- Corpo da Esfera Vermelha (Efeito 3D RPG) -->
  <circle cx="32" cy="32" r="23" fill="#b91c1c"/>
  <circle cx="32" cy="32" r="20" fill="#ef4444"/>
  <circle cx="32" cy="28" r="16" fill="#f87171" opacity="0.4"/>
  <!-- Brilho / Reflexo Superior Esquerdo -->
  <ellipse cx="24" cy="20" rx="6" ry="3" fill="#ffffff" opacity="0.6" transform="rotate(-30 24 20)"/>
  <!-- Logo LinkedIn Centralizado Exatamente no Centro (32, 32) -->
  <g transform="translate(32, 32) scale(1.35) translate(-32, -32)">
    <rect x="26" y="28" width="2.5" height="8" fill="#ffffff" rx="0.5"/>
    <circle cx="27.25" cy="25" r="1.4" fill="#ffffff"/>
    <path d="M31 28h3v1.5c.6-1 1.6-1.5 3-1.5 2.2 0 3.5 1.4 3.5 4.2v4.3h-3v-4c0-1.1-.5-1.7-1.5-1.7-1 0-1.5.6-1.5 1.7v4h-3V28z" fill="#ffffff"/>
  </g>
</symbol>


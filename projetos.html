<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080d12">
    <meta name="description" content="Arquivo de Missões do PHASSCODE — navegue pelo catálogo de projetos e tecnologias.">
    <title>Arquivo de Missões | PHASSCODE</title>
    <link rel="icon" href="assets/img/logo-phasscode.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root { color-scheme: dark; font-family: 'Press Start 2P', monospace; }
        *,*::before,*::after { box-sizing: border-box; }
        html { min-height: 100%; }
        body {
            margin: 0;
            min-width: 300px;
            min-height: 100svh;
            background-color: #080d12;
            background-image: linear-gradient(rgba(5,8,12,.24),rgba(5,8,12,.40)),url('assets/img/guilda-bg.webp');
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            color: #ffe8b4;
        }
        a { color: inherit; }
        button { font: inherit; cursor: pointer; }
        button:focus-visible, a:focus-visible { outline: 3px solid #67e8f9; outline-offset: 4px; }
        .topbar { width: 100%; background: #090e13; border-bottom: 2px solid #075b6b; min-height: 80px; }
        .topbar__inner { max-width: 1340px; margin: auto; padding: 12px 26px; display: flex; justify-content: space-between; align-items: center; gap: 14px; }
        .brand { font-size: clamp(9px,1.1vw,14px); color: #65e8f3; text-shadow: 0 0 6px #176978; text-decoration: none; white-space: nowrap; }
        .brand::before { content:''; display:inline-block; vertical-align:middle; width:11px; height:11px; margin-right:9px; border-radius:50%; background:#1bcc9a; box-shadow:0 0 8px #1bcc9a; }
        .back-top { border: 1px solid #2c8d9f; text-decoration: none; font-size: 8px; padding: 14px 12px; line-height: 1.5; }
        .back-top:hover { background: #15363d; }
        .arquivo-container { width: min(1180px, calc(100% - 24px)); margin: clamp(18px,4vw,44px) auto 48px; }
        .arquivo-mural {
            position:relative;
            box-sizing: border-box;
            width: 100%;
            border: 67px solid transparent;
            border-left-width: 66px;
            border-right-width: 66px;
            border-image-source: url('assets/img/moldura-projeto-simples.webp');
            border-image-slice: 179 171 145 171 fill;
            border-image-width: 67px 66px 67px 66px;
            border-image-repeat: stretch;
            image-rendering: pixelated;
            filter: drop-shadow(0 18px 22px rgba(0,0,0,.66));
        }
        .arquivo-mural__interior { min-width:0; padding: 5px 6px 12px; text-align:center; }
        h1 { margin: 10px 0 7px; color: #ffedc3; font-size: clamp(13px,2.0vw,22px); line-height: 1.65; text-shadow:3px 3px 0 #361407,0 0 5px #341705; }
        .subtitulo { color: #ffd258; text-shadow:2px 2px #3b1a09; font-size: clamp(7px,1vw,10px); line-height:2; margin: 0 0 21px; }
        .arquivo-filtros { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin: 0 0 22px; }
        .arquivo-filtro {
            appearance:none; border: 3px solid #261308; box-shadow: 0 3px 0 #1a0a03, inset 0 2px 0 #87512c;
            background: #3b2115; color:#ffe0a5; padding: 12px 12px;
            font-size: clamp(7px,.78vw,9px); line-height: 1.65;
            transition: filter 120ms ease;
        }
        .arquivo-filtro[aria-pressed="true"] { border-color:#ffc933; color:#ffdd54; background:#251b12; box-shadow:0 3px 0 #1a0a03,inset 0 0 0 1px #805522; }
        .arquivo-filtro:hover { filter: brightness(1.2); }
        .arquivo-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap: 7px 2px; text-align:center; }
        .arquivo-card {
            box-sizing:border-box;
            min-width: 0;
            min-height: 242px;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            border: 34px solid transparent;
            border-top-width: 41px;
            border-bottom-width: 37px;
            border-image-source: url('assets/img/pergaminho-projeto.webp');
            border-image-slice: 165 160 145 160 fill;
            border-image-width: 41px 34px 37px 34px;
            border-image-repeat: stretch;
            background:transparent;
            image-rendering:pixelated;
            color: #4a260c;
            padding: 0 6px;
        }
        .arquivo-card__icone { display:block; color:#77421a; font-size:23px; line-height:1.1; margin-bottom: 8px; }
        .arquivo-card__titulo { color:#4b240c; margin:0 0 9px; font-size: clamp(8px,.92vw,11px); line-height:1.65; overflow-wrap:anywhere; }
        .arquivo-card__tipo { color:#8a4225; margin: 0 0 6px; font-size: 7px; line-height:1.7; }
        .arquivo-card__descricao { color:#633719; margin:0 0 12px; font-size:7px; line-height:1.85; max-width: 25ch; }
        .arquivo-card__abrir { background:#4a250f; color:#ffd879; border:2px solid #a46a22; box-shadow: 0 3px #261208; padding:8px 9px; font-size:7px; line-height:1.6; }
        .arquivo-card__abrir:hover { background: #6f3618; }
        .arquivo-vazio { font-size:10px; line-height:2; color:#ffe0a5; text-shadow: 1px 2px 1px #210e06; padding:34px 10px; }
        .arquivo-rodape { margin: 17px 0 0; font-size: 7px; line-height:2; color: #ffdc95; text-shadow:1px 2px 0 #361407; }
        .retornar { display:inline-block; margin-top:17px; font-size:8px; padding:12px; color:#ffe7ac; text-decoration:none; border:2px solid #c18b4b; background:#341a0d; }
        .retornar:hover { background:#5f3018; }
        .arquivo-overlay { position:fixed; z-index:1000; inset:0; background:rgba(3,6,9,.88); display:grid; place-items:center; padding:12px; }
        .arquivo-modal { width:min(100%,600px); max-height:calc(100dvh - 24px); overflow-y:auto; position:relative; padding: 45px 24px 26px; border: 42px solid transparent; border-image-source:url('assets/img/pergaminho-projeto.webp'); border-image-slice:165 160 145 160 fill; border-image-width:42px; color:#4d2b14; text-align:center; image-rendering:pixelated; }
        .arquivo-modal h2 { font-size:clamp(10px,2vw,16px); line-height:1.8; }
        .arquivo-modal p { font-size:9px; line-height:2.1; }
        .arquivo-modal__fechar {position:absolute; top:0; right:0; border:2px solid #f6b75c; background:#582713; color:#ffe9bd; width:37px; height:37px; font-size:16px; }
        .arquivo-modal__tec {display:flex; flex-wrap:wrap; list-style:none; gap:7px; justify-content:center; padding:0;}
        .arquivo-modal__tec li {border:1px solid #976339; padding:8px; font-size:8px;line-height:1.6;}
        .arquivo-modal__links { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-top:15px; }
        .arquivo-modal__links a { border:2px solid #8d5324; background:#582713; color:#ffdfa7; padding:10px; font-size:8px; line-height:1.6; text-decoration:none; }
        @media (max-width: 850px) {
            .arquivo-mural { border-width: 60px 40px; border-image-width: 60px 40px; }
            .arquivo-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
            .arquivo-card { min-height: 231px; border-width:36px 26px 32px; border-image-width:36px 26px 32px; }
        }
        @media (max-width: 580px) {
            .topbar__inner {padding: 12px 11px;}
            .back-top { font-size: 6px; padding: 11px 7px; }
            .arquivo-container { width: calc(100% - 10px); margin-top:15px; }
            .arquivo-mural { border-width: 49px 24px; border-image-width: 49px 24px; }
            .arquivo-mural__interior {padding:0 0 6px;}
            h1 {font-size:11px;}
            .subtitulo {font-size:7px; margin-bottom:14px;}
            .arquivo-filtros {gap:6px; margin-bottom:12px;}
            .arquivo-filtro {font-size:6px; padding:9px 8px; border-width:2px;}
            .arquivo-grid {grid-template-columns:1fr; gap:1px; }
            .arquivo-card { width:min(100%,330px); justify-self:center; min-height:215px; }
            .arquivo-card__titulo {font-size:9px;}
            .arquivo-rodape {font-size:6px;}
            .retornar { font-size:7px; }
            .arquivo-modal {border-width:30px 23px; border-image-width:30px 23px; padding:31px 2px 18px;}
        }
        @media (max-width:768px) {
            body { background-image:linear-gradient(rgba(5,8,12,.25),rgba(5,8,12,.40)),url('assets/img/guilda-bg-mobile.webp'); }
        }
        @media (prefers-reduced-motion:reduce) {
            *,*::before,*::after {transition:none !important;}
        }
    </style>
</head>
<body>
<header class="topbar">
    <nav class="topbar__inner" aria-label="Navegação principal">
        <a class="brand" href="index.html" aria-label="Voltar à página inicial do PHASSCODE">PHASSCODE</a>
        <a class="back-top" href="index.html">← VOLTAR AO PORTFÓLIO</a>
    </nav>
</header>
<main class="arquivo-container">
    <section class="arquivo-mural" aria-labelledby="arquivo-titulo">
        <div class="arquivo-mural__interior">
            <h1 id="arquivo-titulo">ARQUIVO DE MISSÕES</h1>
            <p class="subtitulo">EXPLORE OUTROS PROJETOS</p>
            <div class="arquivo-filtros" role="group" aria-label="Filtrar projetos">
                <button type="button" class="arquivo-filtro" data-filtro="todos" aria-pressed="true">✦ TODOS</button>
                <button type="button" class="arquivo-filtro" data-filtro="ia" aria-pressed="false">✧ IA &amp; BACKEND</button>
                <button type="button" class="arquivo-filtro" data-filtro="mobile" aria-pressed="false">▣ MOBILE</button>
                <button type="button" class="arquivo-filtro" data-filtro="ferramentas" aria-pressed="false">⚒ FERRAMENTAS</button>
            </div>
            <div class="arquivo-grid" id="arquivo-grid" aria-live="polite"></div>
            <p id="arquivo-vazio" class="arquivo-vazio" hidden>NENHUMA MISSÃO NESTA CATEGORIA.</p>
            <p class="arquivo-rodape">NOVOS REGISTROS SERÃO ADICIONADOS EM BREVE.</p>
            <a class="retornar" href="index.html">← RETORNAR AO PORTFÓLIO</a>
        </div>
    </section>
</main>
<script>
(() => {
    'use strict';
    // Catálogo inicial: somente projetos presentes na seção Projetos original.
    // Substitua ou acrescente itens aqui quando o arquivo completo estiver pronto.
    const projetos = [
        {id:'smart-model-router',nome:'SMART MODEL ROUTER',tipo:'IA & BACKEND',categoria:'ia',icone:'✧',subtitulo:'Integração de LLMs',descricao:'Gateway experimental de integração e roteamento de modelos de linguagem.',tecnologias:['Node.js','APIs REST','OpenRouter'],repositorio:'',demonstracao:''},
        {id:'greencity-sdgp',nome:'GREENCITY SDGP',tipo:'MOBILE',categoria:'mobile',icone:'❧',subtitulo:'Soluções em energia',descricao:'Aplicativo para apoiar o dimensionamento fotovoltaico e a preparação de propostas.',tecnologias:['Flutter','Dart','Firebase'],repositorio:'',demonstracao:''},
        {id:'lithology',nome:'LITHOLOGY',tipo:'FERRAMENTAS',categoria:'ferramentas',icone:'◈',subtitulo:'Dados e relatórios',descricao:'Ferramenta de processamento e exportação de informações técnicas.',tecnologias:['Dados','Excel','PDF'],repositorio:'',demonstracao:''},
        {id:'propriedades-gases',nome:'PROPRIEDADES DOS GASES',tipo:'MOBILE',categoria:'mobile',icone:'⚙',subtitulo:'Cálculo e engenharia',descricao:'Aplicativo de engenharia para cálculos de propriedades de gases.',tecnologias:['Flutter','Dart'],repositorio:'',demonstracao:''},
        {id:'langchain-intro',nome:'LANGCHAIN INTRO',tipo:'IA & ESTUDOS',categoria:'ia',icone:'◇',subtitulo:'Laboratório de agentes',descricao:'Experimentos com fluxos de agentes, memória e orquestração de LLMs.',tecnologias:['LangChain','LangGraph','LLMs'],repositorio:'',demonstracao:''}
    ];
    const esc = x => String(x ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const grid = document.getElementById('arquivo-grid');
    const vazio = document.getElementById('arquivo-vazio');
    const filtros = [...document.querySelectorAll('[data-filtro]')];
    let overlay = null;
    let focoAnterior = null;
    function desenhar(categoria) {
        const itens=projetos.filter(p=>categoria==='todos'||p.categoria===categoria);
        grid.innerHTML=itens.map(p=>`<article class="arquivo-card">
            <span class="arquivo-card__icone" aria-hidden="true">${esc(p.icone)}</span>
            <h2 class="arquivo-card__titulo">${esc(p.nome)}</h2>
            <p class="arquivo-card__tipo">${esc(p.tipo)}</p>
            <p class="arquivo-card__descricao">${esc(p.subtitulo)}</p>
            <button class="arquivo-card__abrir" type="button" data-projeto="${esc(p.id)}" aria-label="Ver detalhes de ${esc(p.nome)}">▶ VER MISSÃO</button>
            </article>`).join('');
        vazio.hidden = itens.length > 0;
        filtros.forEach(f=>f.setAttribute('aria-pressed',String(f.dataset.filtro===categoria)));
    }
    filtros.forEach(f=>f.addEventListener('click',()=>desenhar(f.dataset.filtro)));
    function fechar() {
        if (!overlay) return;
        overlay.remove(); overlay=null;
        document.body.style.overflow='';
        if(focoAnterior?.isConnected) focoAnterior.focus();
        focoAnterior=null;
    }
    function abrir(projeto,origem) {
        fechar(); focoAnterior=origem;
        overlay=document.createElement('div');
        overlay.className='arquivo-overlay';
        const links=[projeto.repositorio&&`<a href="${esc(projeto.repositorio)}" target="_blank" rel="noopener noreferrer">GITHUB ↗</a>`,projeto.demonstracao&&`<a href="${esc(projeto.demonstracao)}" target="_blank" rel="noopener noreferrer">DEMONSTRAÇÃO ↗</a>`].filter(Boolean).join('');
        overlay.innerHTML=`<section class="arquivo-modal" role="dialog" aria-modal="true" aria-labelledby="arquivo-modal-titulo">
           <button type="button" class="arquivo-modal__fechar" aria-label="Fechar detalhes">×</button>
           <p>[ REGISTRO DA MISSÃO ]</p><h2 id="arquivo-modal-titulo">${esc(projeto.nome)}</h2>
           <p>${esc(projeto.tipo)}</p><p>${esc(projeto.descricao)}</p>
           <p><strong>ARSENAL UTILIZADO</strong></p>
           <ul class="arquivo-modal__tec">${projeto.tecnologias.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>
           ${links?`<div class="arquivo-modal__links">${links}</div>`:''}
           </section>`;
        document.body.append(overlay); document.body.style.overflow='hidden';
        overlay.querySelector('.arquivo-modal__fechar').addEventListener('click',fechar);
        overlay.addEventListener('click',e=>{if(e.target===overlay) fechar();});
        overlay.querySelector('.arquivo-modal__fechar').focus();
    }
    grid.addEventListener('click',e=>{
        const b=e.target.closest('[data-projeto]');if(!b)return;
        const p=projetos.find(p=>p.id===b.dataset.projeto);if(p)abrir(p,b);
    });
    document.addEventListener('keydown',e=>{
        if(!overlay)return;
        if(e.key==='Escape'){fechar();return;}
        if(e.key!=='Tab')return;
        const f=[...overlay.querySelectorAll('button,a[href]')];if(!f.length)return;
        if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f[f.length-1].focus();}
        else if(!e.shiftKey&&document.activeElement===f[f.length-1]){e.preventDefault();f[0].focus();}
    });
    desenhar('todos');
})();
</script>
</body>
</html>

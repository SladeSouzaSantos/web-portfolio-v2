server {
    listen 80;
    server_name gbc.phasscode.com www.gbc.phasscode.com;

    root /opt/projects/web-portfolio-v2/dist;
    index index.html;

    location = /projetos.html {
        return 301 /projetos$is_args$args;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Missing assets must return 404 instead of the SPA's HTML document.
    location /assets/ {
        try_files $uri =404;
    }
}

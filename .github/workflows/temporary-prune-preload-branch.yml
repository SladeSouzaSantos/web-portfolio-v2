name: One-time cleanup of merged preloader branch
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/temporary-prune-preload-branch.yml']
permissions:
  contents: write
  pull-requests: read
jobs:
  prune:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {owner, repo} = context.repo;
            const target = 'feat/portfolio-preloader-section-transitions-20261029';
            const expected = '5f7281ad3f8b04f1d725f2b8cf46455128786c6a';
            const {data:pr} = await github.rest.pulls.get({owner,repo,pull_number:17});
            if (!pr.merged || pr.base.ref !== 'dev' || pr.head.sha !== expected)
              throw new Error('PR #17 is not safely merged.');
            const {data:info} = await github.rest.repos.get({owner,repo});
            if (info.default_branch !== 'main') throw new Error('Unexpected default branch.');
            const {data:branch} = await github.rest.repos.getBranch({owner,repo,branch:target});
            if (branch.protected || branch.commit.sha !== expected) throw new Error('Branch changed.');
            const {data:opened} = await github.rest.pulls.list({owner,repo,state:'open',per_page:100});
            if (opened.some(p=>p.head.ref===target)) throw new Error('Open PR still depends on branch.');
            await github.rest.git.deleteRef({owner,repo,ref:'heads/'+target});
            core.info('Merged preloader branch deleted; only dev/main are retained.');

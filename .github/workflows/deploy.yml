name: Validate and deploy portfolio

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate TypeScript, build and browser behavior
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate Conventional Commits
        env:
          COMMIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          COMMIT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if git cat-file -e "${COMMIT_BASE}^{commit}" 2>/dev/null; then
            npx commitlint --from "$COMMIT_BASE" --to "$COMMIT_HEAD"
          else
            git log -1 --format=%B "$COMMIT_HEAD" | npx commitlint
          fi

      - name: Check types and build SPA
        run: npm run build

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Run browser tests against production build
        run: npm test

      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Preserve validated production files
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy validated files to Mac Mini
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      PROJECT_DIR: ${{ github.ref_name == 'main' && '/opt/projects/web-portfolio-v2' || '/opt/projects/web-portfolio-v2-dev' }}
      RELEASE_NAME: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      DEPLOY_BRANCH: ${{ github.ref_name }}
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      - name: Download validated production files
        uses: actions/download-artifact@v4
        with:
          name: portfolio-dist
          path: dist/

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Upload a separate release directory
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: dist
          target: ${{ env.PROJECT_DIR }}/.releases/${{ env.RELEASE_NAME }}

      - name: Update configuration and activate release
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: PROJECT_DIR,RELEASE_NAME,DEPLOY_BRANCH,DEPLOY_SHA
          script: |
            set -eu
            RELEASE_DIR="$PROJECT_DIR/.releases/$RELEASE_NAME"
            test -d "$PROJECT_DIR/.git"
            test -s "$RELEASE_DIR/dist/index.html"
            test -d "$RELEASE_DIR/dist/assets"

            # Refuse to replace an existing real directory with a symlink.
            if [ -e "$PROJECT_DIR/dist" ] && [ ! -L "$PROJECT_DIR/dist" ]; then
              echo 'dist must be absent or a symlink. Move the existing build to a release directory before enabling this deployment.'
              exit 1
            fi

            cd "$PROJECT_DIR"
            test "$(git symbolic-ref --short HEAD)" = "$DEPLOY_BRANCH"
            git pull --ff-only origin "$DEPLOY_BRANCH"
            # Never combine an older artifact with a newer nginx.conf.
            test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
            docker compose -f /opt/docker-stack/proxy/nginx/docker-compose.yml exec -T nginx nginx -t

            PREVIOUS_DIST=$(readlink "$PROJECT_DIR/dist" || true)
            ln -sfn "$RELEASE_DIR/dist" "$PROJECT_DIR/dist"
            if ! docker compose -f /opt/docker-stack/proxy/nginx/docker-compose.yml exec -T nginx nginx -s reload; then
              if [ -n "$PREVIOUS_DIST" ]; then
                ln -sfn "$PREVIOUS_DIST" "$PROJECT_DIR/dist"
              fi
              echo 'Nginx reload failed; restored the previous release when available.'
              exit 1
            fi

  healthcheck:
    name: Verify production response
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Check production routes
        run: |
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 --retry-connrefused --max-time 30 https://gbc.phasscode.com/ --output /dev/null
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 --retry-connrefused --max-time 30 https://gbc.phasscode.com/projetos --output /dev/null

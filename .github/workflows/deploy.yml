name: PHASSCODE | Tests > SAST > Image > DAST > Deploy > Verify

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # DEV push qualifies captured candidates with no remote deployment.
  workflow_dispatch:
    inputs:
      apply_remote:
        description: Deploy tested artifact to the Mac Mini for this branch (default false)
        type: boolean
        default: false
      backend_sha:
        description: Immutable backend commit for manual DEV release (optional fallback vars)
        type: string
        required: false
      frontend_sha:
        description: Immutable frontend commit for manual DEV release (optional fallback vars)
        type: string
        required: false

permissions:
  contents: read

# Nunca publicar duas releases simultâneas da mesma branch.
concurrency:
  # Cancel only superseded automatic candidates, never a manual release.
  group: phasscode-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  # R2: no frontend release can proceed without the same complete paired B2/F3 gate.
  # Both repository variables pin the exact authorized pair of commits.
  # This intentionally fails closed for main until a separately authorized main gate.
  tests:
    name: '1 - Tests / Typecheck / Build / Playwright'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout (full history for Commitlint)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate Conventional Commits
        env:
          COMMIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          COMMIT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${COMMIT_BASE:-}" ]] && git cat-file -e "${COMMIT_BASE}^{commit}" 2>/dev/null; then
            # Validate developer commits; GitHub merge commits carry integration metadata.
            npx commitlint --from "$COMMIT_BASE" --to "$COMMIT_HEAD" --git-log-args=--no-merges
          else
            git log -1 --format=%B "$COMMIT_HEAD" | npx commitlint
          fi

      - name: Select Orbe API configuration for the destination branch
        run: node scripts/orbe-build-policy.mjs --github-env

      - name: Configure public Orbe conversation limit
        env:
          ORBE_MAX_USER_TURNS: ${{ vars.ORBE_MAX_USER_TURNS }}
        run: |
          node -e '
            const fs = require("node:fs");
            const value = process.env.ORBE_MAX_USER_TURNS || "100";
            if (!/^(0|[1-9]\d{0,4})$/.test(value) || Number(value) > 10000) {
              throw new Error("ORBE_MAX_USER_TURNS must be an integer from 0 to 10000");
            }
            fs.appendFileSync(process.env.GITHUB_ENV, `VITE_ORBE_MAX_USER_TURNS=${value}\n`);
          '

      - name: Validate TypeScript and compile Vite
        run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end browser tests
        run: npx playwright test tests/portfolio.spec.ts tests/routing.spec.ts tests/orbe-public.spec.ts tests/orbe-client.spec.ts tests/site-loading.spec.ts tests/section-circle-transition.spec.ts tests/stacks-digitadas.spec.ts tests/sobre-competencias.spec.ts tests/responsive.spec.ts tests/accessibility.spec.ts tests/project-gallery.spec.ts tests/formacao-cursos.spec.ts tests/archive-layout.spec.ts tests/section-ui-ux.spec.ts tests/project-detail-alignment.spec.ts

      - name: Validate Orbe chat lifecycle and keyboard controls against a mock API
        run: npm run test:orbe





      # F3 requires B2 isolated Fastify/Vite and is executed by coordinated.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve exactly the tested static files
        uses: actions/upload-artifact@v6
        with:
          name: portfolio-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  sast:
    name: '2 - SAST (CodeQL) + dependency audit'
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Dependency vulnerability audit (SCA)
        run: npm audit --omit=dev --audit-level=high
      - name: Blocking SAST (Semgrep high-severity findings)
        run: |
          docker run --rm \
            -v "$PWD:/src:ro" -w /src \
            semgrep/semgrep:latest \
            semgrep scan --config p/security-audit \
            --severity ERROR --error src
      - name: Initialize CodeQL (actual SAST)
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Analyze JavaScript and TypeScript
        uses: github/codeql-action/analyze@v4

  image:
    name: '3 - Build and push immutable GHCR image'
    needs: sast
    if: (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.image_meta.outputs.name }}@${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
      - name: Download tested dist (not a second build)
        uses: actions/download-artifact@v7
        with:
          name: portfolio-dist
          path: dist
      - name: Verify downloaded static files
        run: test -s dist/index.html && test -d dist/assets
      - name: Generate lowercase registry reference
        id: image_meta
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish production artifact to GHCR
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .ci/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image_meta.outputs.name }}:sha-${{ github.sha }}
          provenance: true
          sbom: true

  dast:
    name: '4 - DAST on disposable image (OWASP ZAP)'
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start immutable image in ephemeral staging
        env:
          IMAGE_REF: ${{ needs.image.outputs.ref }}
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$IMAGE_REF"
          docker run -d --name phasscode-dast -p 127.0.0.1:8080:80 "$IMAGE_REF"
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs phasscode-dast
          exit 1
      - name: Validate SPA route before ZAP
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/ --output /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/projetos --output /dev/null
      - name: Scan ephemeral staging with OWASP ZAP Baseline
        shell: bash
        run: |
          mkdir -p security-reports
          chmod 777 security-reports
          cp .ci/zap-rules.conf security-reports/zap-rules.conf
          # -I allows advisory WARNs but fails on configured FAIL rules.
          docker run --rm --network host \
            -v "$PWD/security-reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:8080 \
            -m 1 -I -c zap-rules.conf \
            -r zap-report.html -J zap-report.json
      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: zap-report
          path: security-reports/
          if-no-files-found: warn
          retention-days: 14
      - name: Clean up disposable staging
        if: always()
        run: docker rm -f phasscode-dast || true

  deploy:
    name: '5 - Deploy identical image contents to Mac Mini Nginx'
    needs: [image, dast]
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') && inputs.apply_remote
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    env:
      PROJECT_DIR: ${{ github.ref_name == 'main' && '/opt/projects/web-portfolio-v2' || '/opt/projects/web-portfolio-v2-dev' }}
      RELEASE_NAME: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      DEPLOY_BRANCH: ${{ github.ref_name }}
      DEPLOY_SHA: ${{ github.sha }}
      IMAGE_REF: ${{ needs.image.outputs.ref }}
      GHCR_USER: ${{ github.repository_owner }}
      GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Require explicit frontend remote release enablement
        env:
          ENABLE_REMOTE_DEPLOY: ${{ vars.ENABLE_REMOTE_DEPLOY }}
        run: |
          set -euo pipefail
          test "$ENABLE_REMOTE_DEPLOY" = true
      - name: Connect to Tailscale
        uses: ./.github/actions/tailscale-connect
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: ${{ vars.TAILSCALE_TAGS || 'tag:ci' }}
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
      - name: Pull tested image, extract dist, and switch release
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: PROJECT_DIR,RELEASE_NAME,DEPLOY_BRANCH,DEPLOY_SHA,IMAGE_REF,GHCR_USER,GHCR_PULL_TOKEN
          command_timeout: 20m
          script: |
            set -eu
            RELEASE_DIR="$PROJECT_DIR/.releases/$RELEASE_NAME"
            test -d "$PROJECT_DIR/.git"
            cd "$PROJECT_DIR"
            test "$(git symbolic-ref --short HEAD)" = "$DEPLOY_BRANCH"
            git pull --ff-only origin "$DEPLOY_BRANCH"
            test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"

            # Prevent accidental deletion of a pre-existing physical dist directory.
            if [ -e "$PROJECT_DIR/dist" ] && [ ! -L "$PROJECT_DIR/dist" ]; then
              echo 'ERROR: dist is a real directory. Back it up and create a symlink before activating image-based deploy.'
              exit 1
            fi

            # Private GHCR images require read:packages; public images can be pulled without a token.
            if [ -n "$GHCR_PULL_TOKEN" ]; then
              printf '%s' "$GHCR_PULL_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            fi
            docker pull "$IMAGE_REF"
            mkdir -p "$RELEASE_DIR/dist"
            CONTAINER_ID=$(docker create "$IMAGE_REF")
            trap 'docker rm -f "$CONTAINER_ID" >/dev/null 2>&1 || true' EXIT
            docker cp "$CONTAINER_ID:/usr/share/nginx/html/." "$RELEASE_DIR/dist/"
            test -s "$RELEASE_DIR/dist/index.html"
            test -d "$RELEASE_DIR/dist/assets"
            docker rm "$CONTAINER_ID"
            CONTAINER_ID=''
            trap - EXIT

            PROXY_COMPOSE=/opt/docker-stack/proxy/nginx/docker-compose.yml

            if [ "$DEPLOY_BRANCH" = "main" ]; then
              SITE_HOST=gbc.phasscode.com
            else
              SITE_HOST=devgbc.phasscode.com
            fi

            # A release anterior deve existir para permitir rollback.
            test -L "$PROJECT_DIR/dist"
            PREVIOUS_DIST=$(readlink "$PROJECT_DIR/dist")
            test -n "$PREVIOUS_DIST"
            test -s "$PROJECT_DIR/dist/index.html"

            NEXT_LINK="$PROJECT_DIR/.dist-next-$RELEASE_NAME"
            ROLLBACK_LINK="$PROJECT_DIR/.dist-rollback-$RELEASE_NAME"
            CHECK_DIR=$(mktemp -d)
            ACTIVATED=0

            rollback_on_exit() {
              result=$?
              trap - EXIT

              if [ "$result" -ne 0 ] && [ "$ACTIVATED" -eq 1 ]; then
                echo "ERROR: Deploy failed. Restoring previous release." >&2
                if ln -s "$PREVIOUS_DIST" "$ROLLBACK_LINK" &&
                   mv -Tf "$ROLLBACK_LINK" "$PROJECT_DIR/dist"; then
                  echo "Previous release restored: $PREVIOUS_DIST"
                  docker compose -f "$PROXY_COMPOSE" exec -T nginx nginx -s reload || true
                else
                  echo "CRITICAL: Automatic rollback failed! Check $PROJECT_DIR/dist immediately." >&2
                fi
              fi

              rm -f "$NEXT_LINK" "$ROLLBACK_LINK" || true
              rm -rf "$CHECK_DIR" || true
              exit "$result"
            }
            trap 'rollback_on_exit' EXIT

            # Conferir que nao existem links temporarios residuais.
            test ! -e "$NEXT_LINK" && test ! -L "$NEXT_LINK"
            test ! -e "$ROLLBACK_LINK" && test ! -L "$ROLLBACK_LINK"

            # Ler os nomes reais dos arquivos compilados da release a ser ativada.
            ASSETS=$(grep -oE '/assets/[^"[:space:]]+\.(js|css)' \
              "$RELEASE_DIR/dist/index.html" | sort -u)
            test -n "$ASSETS"
            EXPECTED_JS=$(printf '%s\n' "$ASSETS" | grep -m 1 '\.js$')
            test -n "$EXPECTED_JS"

            # Validar a configuracao do Nginx antes da troca.
            docker compose -f "$PROXY_COMPOSE" exec -T nginx nginx -t

            # Ativacao atomica, sem remover dist previamente.
            ln -s "$RELEASE_DIR/dist" "$NEXT_LINK"
            ACTIVATED=1
            mv -Tf "$NEXT_LINK" "$PROJECT_DIR/dist"
            
            docker compose -f "$PROXY_COMPOSE" exec -T nginx nginx -s reload

            # Verificar HTML exato da release e fallback SPA no Nginx local.
            for ROUTE in / /projetos; do
              curl --fail --silent --show-error --max-time 30 \
                --retry 3 --retry-delay 2 \
                -H "Host: $SITE_HOST" \
                -D "$CHECK_DIR/headers" -o "$CHECK_DIR/local.html" \
                "http://127.0.0.1$ROUTE"

              grep -qiE '^content-type:[[:space:]]*text/html' "$CHECK_DIR/headers"
              cmp -s "$RELEASE_DIR/dist/index.html" "$CHECK_DIR/local.html"
              echo "Local route OK: $ROUTE"
            done

            # SPA fallback pode devolver HTTP 200 para um asset ausente.
            # Por isso, verificar MIME e conteudo nao vazio para cada JS/CSS.
            for ASSET in $ASSETS; do
              curl --fail --silent --show-error --max-time 30 \
                -H "Host: $SITE_HOST" \
                -D "$CHECK_DIR/headers" -o "$CHECK_DIR/asset" \
                "http://127.0.0.1$ASSET"
              test -s "$CHECK_DIR/asset"
              case "$ASSET" in
                *.js)
                  grep -qiE '^content-type:[[:space:]]*(application|text)/javascript' "$CHECK_DIR/headers"
                  ;;
                *.css)
                  grep -qiE '^content-type:[[:space:]]*text/css' "$CHECK_DIR/headers"
                  ;;
              esac
              echo "Local asset OK: $ASSET"
            done

            # Confirmar que Cloudflare entrega o JS desta mesma release.
            curl --fail --silent --show-error --location --max-time 30 \
              --retry 3 --retry-delay 2 \
              -H "Cache-Control: no-cache" \
              -D "$CHECK_DIR/public.headers" -o "$CHECK_DIR/public.html" \
              "https://$SITE_HOST/?healthcheck=$RELEASE_NAME"

            grep -qiE '^content-type:[[:space:]]*text/html' "$CHECK_DIR/public.headers"
            grep -Fq "$EXPECTED_JS" "$CHECK_DIR/public.html"

            echo "Public release verified: https://$SITE_HOST"
            echo "Deploy successful: $RELEASE_NAME"

  verify_deploy:
    name: '6 - Verify deployed site'
    needs: deploy
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev' && inputs.apply_remote
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_URL: ${{ github.ref_name == 'main' && 'https://gbc.phasscode.com' || vars.DEV_SITE_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Download original tested release for public comparison
        uses: actions/download-artifact@v7
        with:
          name: portfolio-dist
          path: dist
      - name: Install Chromium for public smoke tests
        run: npx playwright install --with-deps chromium
      - name: Check public routing and asset integrity
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SITE_URL:-}" ]; then
            echo 'Missing GitHub Actions variable DEV_SITE_URL for dev deploy validation.'
            exit 1
          fi
          for route in / /projetos; do
            headers=$(mktemp)
            body=$(mktemp)
            curl --fail --silent --show-error --location \
              --retry 5 --retry-delay 2 --retry-connrefused \
              --max-time 30 -D "$headers" -o "$body" "${SITE_URL%/}$route"
            grep -qi '<html' "$body"
            grep -qiE 'content-type:[[:space:]]*text/html' "$headers"
            echo "OK: ${SITE_URL%/}$route"
            rm -f "$headers" "$body"
          done
      - name: Smoke test published site through Nginx and Cloudflare
        env:
          SMOKE_BASE_URL: ${{ env.SITE_URL }}
          SMOKE_EXPECTED_DIST: dist
        run: npm run test:smoke
      - name: Upload public smoke report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-smoke-${{ github.ref_name }}
          path: |
            playwright-report/smoke/
            test-results/smoke/
          if-no-files-found: ignore
          retention-days: 7

name: One-time cleanup of merged Orbe branch
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/temporary-orbe-branch-cleanup.yml']
permissions:
  contents: write
  pull-requests: read
jobs:
  cleanup:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {owner,repo} = context.repo;
            const target = 'feat/orbe-chat-window-controls-20261029';
            const expected = '09b16bc4d8f9585a6cb58e6e1233f246c199300c';
            const pr = await github.rest.pulls.get({owner,repo,pull_number:14});
            if (!pr.data.merged || pr.data.base.ref !== 'dev' ||
                pr.data.head.sha !== expected) throw new Error('PR #14 must remain merged before cleanup.');
            const repoData = (await github.rest.repos.get({owner,repo})).data;
            if (repoData.default_branch !== 'main') throw new Error('Unexpected default branch.');
            const b = (await github.rest.repos.getBranch({owner,repo,branch:target})).data;
            if (b.protected || b.commit.sha !== expected) throw new Error('Unexpected protected or moved target.');
            await github.rest.git.deleteRef({owner,repo,ref:'heads/'+target});
            core.info('Removed merged Orbe work branch. dev/main retained.');

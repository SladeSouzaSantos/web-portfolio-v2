name: Sync PPKS Academic snapshot to DEV
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Generate public academic snapshot from backend DEV
        run: npm run sync:academic
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
      - name: Commit DEV snapshot only after checks pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/ppks-academic.snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(academia): refresh public PPKS DEV snapshot'
            git push origin HEAD:dev
          fi

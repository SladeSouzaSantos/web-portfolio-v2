name: One-time cleanup Orbe welcome PR branch
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/temporary-prune-orbe-welcome.yml']
permissions:
  contents: write
  pull-requests: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {owner,repo}=context.repo;
            const target='fix/orbe-welcome-and-single-chat-20261029';
            const expected='97911a71f53c74321cde5c7e6bd805e268227592';
            const pr=await github.rest.pulls.get({owner,repo,pull_number:16});
            if(!pr.data.merged||pr.data.base.ref!=='dev'||pr.data.head.sha!==expected)
              throw new Error('Expected merged PR #16.');
            const {data:r}=await github.rest.repos.get({owner,repo});
            if(r.default_branch!=='main') throw new Error('Default changed.');
            const {data:b}=await github.rest.repos.getBranch({owner,repo,branch:target});
            if(b.protected||b.commit.sha!==expected) throw new Error('Unexpected branch state.');
            const opened=await github.rest.pulls.list({owner,repo,state:'open',per_page:100});
            if(opened.data.some(p=>p.head.ref===target)) throw new Error('Open PR depends on branch.');
            await github.rest.git.deleteRef({owner,repo,ref:'heads/'+target});
            core.info('Removed completed Orbe welcome branch.');

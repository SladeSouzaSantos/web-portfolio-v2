name: One-time cleanup merged circular scene transition branch
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/temporary-prune-circular-section.yml']
permissions:
  contents: write
  pull-requests: read
jobs:
  cleanup:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {owner,repo} = context.repo;
            const target = 'feat/section-circular-reveal-20261029';
            const expected = 'afddd8698dab36fb3c046942dcff49fa450f6c5b';
            const {data:pr} = await github.rest.pulls.get({owner,repo,pull_number:18});
            if (!pr.merged || pr.base.ref !== 'dev' || pr.head.sha !== expected)
              throw new Error('PR #18 is not confirmed merged.');
            const {data:repoInfo} = await github.rest.repos.get({owner,repo});
            if (repoInfo.default_branch !== 'main') throw new Error('Unexpected default branch.');
            const {data:b} = await github.rest.repos.getBranch({owner,repo,branch:target});
            if (b.protected || b.commit.sha !== expected) throw new Error('Branch changed or protected.');
            const {data:opened} = await github.rest.pulls.list({owner,repo,state:'open',per_page:100});
            if (opened.some(p=>p.head.ref === target)) throw new Error('Open PR still depends on branch.');
            await github.rest.git.deleteRef({owner,repo,ref:'heads/'+target});
            core.info('Pruned merged circular transition branch. Kept dev/main.');
